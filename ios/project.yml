name: FitSup
options:
  bundleIdPrefix: app.fitsup
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Scegli il tuo Team in Xcode (Signing & Capabilities): basta l'Apple ID gratuito per installarla sul tuo iPhone
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FitSup:
    type: application
    platform: iOS
    sources: [FitSup]
    info:
      path: FitSup/Info.plist
      properties:
        CFBundleDisplayName: FitSup
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitsup.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
