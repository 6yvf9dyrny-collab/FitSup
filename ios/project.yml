name: FitSup
options:
  bundleIdPrefix: app.fitsup
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Il tuo Team (Signing & Capabilities): basta l'Apple ID gratuito per installarla sul tuo iPhone
    DEVELOPMENT_TEAM: 5BR937DR7G
    CODE_SIGN_STYLE: Automatic
targets:
  FitSup:
    type: application
    platform: iOS
    sources: [FitSup, Shared]
    dependencies:
      - target: FitSupRest
      - target: FitSupWatch
    info:
      path: FitSup/Info.plist
      properties:
        CFBundleDisplayName: FitSup
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitsuppliesios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  FitSupRest:
    type: app-extension
    platform: iOS
    sources: [FitSupRest, Shared]
    info:
      path: FitSupRest/Info.plist
      properties:
        CFBundleDisplayName: FitSup Recupero
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitsuppliesios.rest
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  FitSupWatch:
    type: application
    platform: watchOS
    sources: [FitSupWatch]
    info:
      path: FitSupWatch/Info.plist
      properties:
        CFBundleDisplayName: FitSup
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.fitsuppliesios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitsuppliesios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
